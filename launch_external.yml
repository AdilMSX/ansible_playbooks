
---
- name: Launch external PostgreSQL Job Template
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_url: "https://aap.example.com"
    aap_api_token: "{{ lookup('env', 'AAP_API_TOKEN') }}"

    # ID of the external PostgreSQL Job Template
    external_jt_id: 45

    # Demo mapping: replace with your actual AAP IDs
    inventory_execution_map:
      inventory_z1:
        # credential_id: 101
        instance_group_id: 3
        zone: zone1

      inventory_z2:
        # credential_id: 102
        instance_group_id: 4
        zone: zone2

      inventory_z3:
        # credential_id: 103
        instance_group_id: 4
        zone: zone3

  tasks:

    - name: Validate discovery artifacts
      ansible.builtin.assert:
        that:
          - discovered_host is defined
          - discovered_inventory_id is defined
          - discovered_inventory_name is defined
        fail_msg: "Missing discovery artifacts."

    - name: Validate inventory mapping
      ansible.builtin.assert:
        that:
          - discovered_inventory_name in inventory_execution_map
        fail_msg: >-
          No execution mapping found for
          {{ discovered_inventory_name }}.

    - name: Calculate execution parameters
      ansible.builtin.set_fact:
        # selected_credential_id: >-
        #   {{ inventory_execution_map[discovered_inventory_name].credential_id }}
        selected_instance_group_id: >-
          {{ inventory_execution_map[discovered_inventory_name].instance_group_id }}
        selected_zone: >-
          {{ inventory_execution_map[discovered_inventory_name].zone }}

    - name: Display calculated parameters
      ansible.builtin.debug:
        msg:
          - "Host: {{ discovered_host }}"
          - "Inventory: {{ discovered_inventory_name }}"
          - "Inventory ID: {{ discovered_inventory_id }}"
          - "Zone: {{ selected_zone }}"
          # - "Credential ID: {{ selected_credential_id }}"
          - "Instance Group ID: {{ selected_instance_group_id }}"
          - "External JT ID: {{ external_jt_id }}"

    - name: Launch external PostgreSQL JT
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/controller/v2/job_templates/{{ external_jt_id }}/launch/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          inventory: "{{ discovered_inventory_id | int }}"
          # credentials:
          #   - "{{ selected_credential_id | int }}"
          instance_groups:
            - "{{ selected_instance_group_id | int }}"
          extra_vars:
            target_host: "{{ discovered_host }}"
            zone: "{{ selected_zone }}"
        validate_certs: false
        status_code: 201
        return_content: true
      register: external_launch
      no_log: true

    - name: Display external job information
      ansible.builtin.debug:
        msg:
          - "External job ID: {{ external_launch.json.id }}"
          - "External job URL: {{ aap_url }}/execution/jobs/playbook/{{ external_launch.json.id }}/output"

    - name: Export external job ID to workflow
      ansible.builtin.set_stats:
        data:
          external_job_id: "{{ external_launch.json.id }}"
          external_job_url: "{{ aap_url }}/execution/jobs/playbook/{{ external_launch.json.id }}/output"
        per_host: false

